<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间线笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e12; --sidebar: #0a0a0e; --surface: #13131a;
  --border: #1c1c24; --border2: #2a2a35;
  --text: #eae5de; --text-dim: #d8d2c8;
  --muted: #7a7a8a; --muted2: #5a5a68; --muted3: #3a3a48;
  --accent: #b4a078; --accent-dim: rgba(180,160,120,0.1);
  --accent-glow: rgba(180,160,120,0.18); --danger: #c07070;
  --ok: #78a078;
  --sidebar-w: 220px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Mono','Courier New',monospace;
  height: 100dvh; display: flex; overflow: hidden;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Sidebar overlay (mobile) ── */
#sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 40;
}
#sidebar-overlay.show { display: block; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 50;
}
#sidebar-header { padding: 20px 14px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#sidebar-label { font-size: 10px; letter-spacing: .2em; color: var(--muted2); margin-bottom: 12px; }
#new-tl-btn {
  width: 100%; background: none; border: 1px dashed var(--border2);
  color: var(--muted2); border-radius: 6px; padding: 8px 10px;
  font-size: 11px; cursor: pointer; font-family: 'DM Mono',monospace;
  letter-spacing: .08em; display: flex; align-items: center; gap: 7px; transition: all .2s;
}
#new-tl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
#new-tl-btn .plus { font-size: 14px; line-height: 1; }
#sidebar-actions { display: flex; gap: 6px; margin-top: 8px; }
.sidebar-action-btn {
  flex: 1; background: none; border: 1px solid var(--border2); color: var(--muted);
  border-radius: 5px; padding: 6px 4px; font-size: 10px; cursor: pointer;
  font-family: 'DM Mono',monospace; letter-spacing: .06em; transition: all .2s; text-align: center;
}
.sidebar-action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
#tl-list { flex: 1; overflow-y: auto; padding: 8px; }
.tl-item {
  padding: 9px 10px; border-radius: 6px; cursor: pointer;
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 2px; transition: background .15s; position: relative;
}
.tl-item:hover { background: var(--surface); }
.tl-item.active { background: var(--accent-dim); }
.tl-item.active .tl-name { color: var(--accent); }
.tl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted3); flex-shrink: 0; margin-top: 5px; }
.tl-item.active .tl-dot { background: var(--accent); }
.tl-info { flex: 1; min-width: 0; }
.tl-name { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.tl-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.tl-del { opacity: 0; background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0; transition: color .15s, opacity .15s; align-self: center; }
.tl-item:hover .tl-del { opacity: 1; }
.tl-del:hover { color: var(--danger); }

/* sync bar */
#sync-bar {
  padding: 8px 14px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  font-size: 10px; letter-spacing: .06em; min-height: 36px;
}
#sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted3); flex-shrink: 0; transition: background .3s; }
#sync-dot.syncing { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
#sync-dot.ok { background: var(--ok); }
#sync-dot.err { background: var(--danger); }
#sync-label { color: var(--muted); flex: 1; font-size: 10px; }
#sync-setup-btn { background: none; border: none; color: var(--muted2); font-size: 10px; cursor: pointer; font-family: 'DM Mono',monospace; padding: 2px 4px; border-radius: 3px; transition: color .15s; }
#sync-setup-btn:hover { color: var(--accent); }

/* ── Main ── */
#main { flex: 1; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; position: relative; min-width: 0; }

/* Mobile top bar */
#mobile-bar {
  display: none;
  align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(14,14,18,.97);
}
#menu-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); padding: 4px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 4px;
}
#menu-btn span { display: block; width: 18px; height: 1.5px; background: currentColor; border-radius: 2px; transition: all .2s; }
#mobile-title { font-family: 'Noto Serif SC',serif; font-weight: 300; font-size: 15px; color: #e8e2d9; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; }
#mobile-sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted3); flex-shrink: 0; transition: background .3s; }
#mobile-sync-dot.syncing { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
#mobile-sync-dot.ok { background: var(--ok); }
#mobile-sync-dot.err { background: var(--danger); }

/* Desktop header */
#header {
  border-bottom: 1px solid var(--border); padding: 16px 40px;
  display: none; align-items: center; justify-content: space-between;
  flex-shrink: 0; background: rgba(14,14,18,.97);
}
#header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
#pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(180,160,120,.4); }
  50% { opacity:.7; box-shadow:0 0 0 5px rgba(180,160,120,0); }
}
#title-input {
  background: transparent; border: none; outline: none;
  font-family: 'Noto Serif SC',serif; font-weight: 300;
  color: #e8e2d9; font-size: 18px; letter-spacing: .05em;
  flex: 1; min-width: 0; border-bottom: 1px solid transparent; transition: border-color .2s; padding: 2px 0;
}
#title-input:focus { border-bottom-color: var(--accent); }
#entry-count { color: var(--muted3); font-size: 10px; letter-spacing: .1em; flex-shrink: 0; }

#scroll-area { flex: 1; overflow-y: auto; padding: 36px 40px 140px; -webkit-overflow-scrolling: touch; }

.state-box { text-align: center; margin-top: 100px; color: var(--muted2); display: none; }
.state-icon { font-size: 36px; margin-bottom: 16px; opacity: .25; }
.state-label { font-size: 13px; letter-spacing: .1em; }
.state-hint { font-size: 11px; margin-top: 8px; color: var(--muted3); }

.date-sep { display: flex; align-items: center; gap: 12px; margin: 28px 0 18px; }
.date-sep span { color: var(--muted2); font-size: 10px; letter-spacing: .15em; flex-shrink: 0; }
.date-sep hr { flex: 1; border: none; border-top: 1px solid var(--border); }

.day-track { padding-left: 24px; border-left: 1px solid var(--border); }

.entry { display: flex; gap: 20px; margin-bottom: 26px; position: relative; animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
.entry-dot { position: absolute; left: -29px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--border); border: 1px solid var(--muted2); }
.entry-main { flex: 1; min-width: 0; }
.entry-time { font-size: 10px; color: var(--muted); letter-spacing: .12em; margin-bottom: 6px; }
.entry-text { font-size: 13px; line-height: 1.85; color: var(--text-dim); white-space: pre-wrap; font-family: 'DM Mono',monospace; word-break: break-word; }
.entry-actions { display: flex; flex-direction: column; gap: 4px; padding-top: 22px; opacity: 0; transition: opacity .15s; }
.entry:hover .entry-actions { opacity: 1; }

.edit-area { width: 100%; min-height: 80px; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: 'DM Mono',monospace; line-height: 1.75; outline: none; resize: none; }
.edit-btns { display: flex; gap: 8px; margin-top: 8px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 11px; padding: 3px 6px; border-radius: 3px; transition: color .15s, background .15s; font-family: 'DM Mono',monospace; letter-spacing: .05em; }
.icon-btn:hover { color: var(--text); background: #1e1e28; }
.icon-btn.danger:hover { color: var(--danger); }

#draft-wrap { padding-left: 24px; border-left: 1px solid var(--accent); margin-top: 4px; display: none; animation: fadeUp .22s ease; }
#draft-inner { position: relative; }
#draft-dot { position: absolute; left: -29px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
#draft-time { font-size: 10px; color: var(--accent); letter-spacing: .12em; margin-bottom: 8px; }
#draft-textarea { width: 100%; min-height: 96px; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; padding: 12px 14px; color: var(--text); font-size: 13px; font-family: 'DM Mono',monospace; line-height: 1.85; outline: none; caret-color: var(--accent); resize: none; }
#draft-footer { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
#commit-btn { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 6px 16px; font-size: 11px; cursor: pointer; font-family: 'DM Mono',monospace; letter-spacing: .08em; transition: background .15s; }
#commit-btn:hover { background: var(--accent-glow); }

#add-btn-wrap { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; }
#add-btn { background: var(--bg); border: 1px solid var(--border2); color: #8a8490; border-radius: 40px; padding: 11px 26px; font-size: 11px; cursor: pointer; font-family: 'DM Mono',monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 9px; transition: border-color .2s, color .2s, background .2s; box-shadow: 0 4px 20px rgba(0,0,0,.4); white-space: nowrap; }
#add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(180,160,120,.04); }
#add-btn .plus { font-size: 15px; line-height: 1; color: var(--accent); }

/* Modals */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.show { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 24px; width: 100%; max-width: 360px; animation: fadeUp .2s ease; }
.modal-box h3 { font-family: 'Noto Serif SC',serif; font-weight: 300; font-size: 16px; color: #e8e2d9; margin-bottom: 6px; letter-spacing: .05em; }
.modal-box p { font-size: 11px; color: var(--muted); line-height: 1.8; margin-bottom: 16px; }
.modal-label { font-size: 10px; color: var(--muted2); letter-spacing: .1em; margin-bottom: 6px; margin-top: 12px; }
.modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: 'DM Mono',monospace; outline: none; caret-color: var(--accent); transition: border-color .2s; -webkit-appearance: none; }
.modal-input:focus { border-color: var(--accent); }
.modal-footer { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.btn-ok { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 8px 16px; font-size: 11px; cursor: pointer; font-family: 'DM Mono',monospace; letter-spacing: .08em; transition: background .15s; }
.btn-ok:hover { background: var(--accent-glow); }
.btn-cancel { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 5px; padding: 8px 12px; font-size: 11px; cursor: pointer; font-family: 'DM Mono',monospace; transition: all .15s; }
.btn-cancel:hover { color: var(--text); border-color: var(--muted2); }

/* ── Mobile breakpoint ── */
@media (max-width: 640px) {
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100dvh;
    transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #mobile-bar { display: flex; }
  #header { display: none !important; }
  #scroll-area { padding: 20px 20px 120px; }
  .day-track { padding-left: 20px; }
  .entry-dot { left: -25px; }
  .entry-actions { opacity: 1; }
  #add-btn-wrap { bottom: 24px; width: calc(100% - 40px); left: 20px; transform: none; }
  #add-btn { width: 100%; justify-content: center; padding: 14px 20px; font-size: 13px; border-radius: 14px; }
  .tl-del { opacity: 1; }
}
</style>
</head>
<body>

<!-- Mobile sidebar overlay -->
<div id="sidebar-overlay"></div>

<div id="sidebar">
  <div id="sidebar-header">
    <div id="sidebar-label">我的时间线</div>
    <button id="new-tl-btn"><span class="plus">+</span> 新建时间线</button>
    <div id="sidebar-actions">
      <button class="sidebar-action-btn" id="export-btn">↑ 导出</button>
      <button class="sidebar-action-btn" id="import-btn">↓ 导入</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
  <div id="tl-list"></div>
  <div id="sync-bar">
    <div id="sync-dot"></div>
    <div id="sync-label">未配置同步</div>
    <button id="sync-setup-btn">设置</button>
  </div>
</div>

<div id="main">
  <!-- Mobile top bar -->
  <div id="mobile-bar">
    <button id="menu-btn" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div id="mobile-title">时间线笔记</div>
    <div id="mobile-sync-dot"></div>
  </div>

  <!-- Desktop header -->
  <div id="header">
    <div id="header-left">
      <div id="pulse-dot"></div>
      <input id="title-input" type="text" placeholder="时间线名称…" maxlength="60">
    </div>
    <div id="entry-count"></div>
  </div>

  <div id="scroll-area">
    <div class="state-box" id="no-sel" style="display:block">
      <div class="state-icon">◎</div>
      <div class="state-label">选择或新建一条时间线</div>
      <div class="state-hint">从左侧菜单开始</div>
    </div>
    <div class="state-box" id="empty-state">
      <div class="state-icon">○</div>
      <div class="state-label">还没有任何记录</div>
      <div class="state-hint">点击下方按钮，写下第一条</div>
    </div>
    <div id="tl-content"></div>
    <div id="draft-wrap">
      <div id="draft-inner">
        <div id="draft-dot"></div>
        <div id="draft-time"></div>
        <textarea id="draft-textarea" placeholder="写下这一刻的想法…" rows="5"></textarea>
        <div id="draft-footer">
          <button id="commit-btn">记录</button>
          <button class="icon-btn" id="cancel-btn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div id="add-btn-wrap">
    <button id="add-btn"><span class="plus">+</span> 新建记录</button>
  </div>
</div>

<!-- New timeline modal -->
<div class="modal-bg" id="modal-new-tl">
  <div class="modal-box">
    <h3>新建时间线</h3>
    <p></p>
    <input class="modal-input" id="modal-tl-input" type="text" placeholder="给这条时间线取个名字…" maxlength="40">
    <div class="modal-footer">
      <button class="btn-cancel" id="modal-tl-cancel">取消</button>
      <button class="btn-ok" id="modal-tl-ok">创建</button>
    </div>
  </div>
</div>

<!-- Sync setup modal -->
<div class="modal-bg" id="modal-sync">
  <div class="modal-box">
    <h3>GitHub Gist 同步</h3>
    <p>Token 只存在本机浏览器里，不会写入 HTML 文件。</p>
    <div class="modal-label">GITHUB TOKEN（gist 权限）</div>
    <input class="modal-input" id="sync-token-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx" autocomplete="off">
    <div class="modal-footer">
      <button class="btn-cancel" id="modal-sync-cancel">取消</button>
      <button class="btn-ok" id="modal-sync-clear" style="border-color:var(--danger);color:var(--danger);background:rgba(192,112,112,0.08)">清除</button>
      <button class="btn-ok" id="modal-sync-ok">保存并同步</button>
    </div>
  </div>
</div>

<script>
const DATA_KEY  = "tl-notes-v2";
const TOKEN_KEY = "tl-gist-token";
const GIST_ID   = "6ea884513c40ef49d5dc576708e5090b";
const GIST_FILE = "timeline-notes.json";

let db = { timelines: [] };
let activeId = null, draftTime = null, editingId = null;
let syncTimeout = null;
const isMobile = () => window.innerWidth <= 640;

function loadDB() { try { const r=localStorage.getItem(DATA_KEY); if(r) db=JSON.parse(r); } catch {} }
function saveDB() { localStorage.setItem(DATA_KEY, JSON.stringify(db)); schedulePush(); }
function getToken() { return localStorage.getItem(TOKEN_KEY)||""; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n) { return String(n).padStart(2,"0"); }
function fmtDate(iso) { const d=new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
function fmtFull(iso) { const d=new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtTime(iso) { const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function activeTL() { return db.timelines.find(t=>t.id===activeId)||null; }

// ── Sync status ──
function setSyncStatus(state, label) {
  document.getElementById("sync-dot").className = state;
  document.getElementById("sync-label").textContent = label;
  document.getElementById("mobile-sync-dot").className = state;
}

// ── Gist ──
async function pullFromGist() {
  const token = getToken(); if (!token) return;
  setSyncStatus("syncing","同步中…");
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`,{
      headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"}
    });
    if (!res.ok) throw new Error(res.status);
    const gist = await res.json();
    const content = gist.files[GIST_FILE]?.content;
    if (content) {
      const remote = JSON.parse(content);
      if (remote.timelines) {
        db = remote;
        localStorage.setItem(DATA_KEY, JSON.stringify(db));
        activeId = db.timelines[0]?.id||null;
        render();
      }
    }
    setSyncStatus("ok","已同步 · "+fmtTime(new Date().toISOString()));
  } catch { setSyncStatus("err","同步失败，检查 Token"); }
}

async function pushToGist() {
  const token = getToken(); if (!token) return;
  setSyncStatus("syncing","保存中…");
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`,{
      method:"PATCH",
      headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(db,null,2)}}})
    });
    if (!res.ok) throw new Error(res.status);
    setSyncStatus("ok","已保存 · "+fmtTime(new Date().toISOString()));
  } catch { setSyncStatus("err","保存失败，检查 Token"); }
}

function schedulePush() { clearTimeout(syncTimeout); syncTimeout=setTimeout(pushToGist,2000); }

// ── Sidebar (mobile drawer) ──
function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-overlay").classList.add("show");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("show");
}

// ── Render sidebar ──
function renderSidebar() {
  const list = document.getElementById("tl-list");
  list.innerHTML = "";
  if (!db.timelines.length) {
    list.innerHTML=`<div style="padding:16px 10px;font-size:11px;color:var(--muted3);text-align:center;line-height:1.9">还没有时间线<br>点击上方新建</div>`;
    return;
  }
  db.timelines.forEach(tl => {
    const last = tl.entries.length ? fmtDate(tl.entries[tl.entries.length-1].time) : "暂无记录";
    const el = document.createElement("div");
    el.className = "tl-item"+(tl.id===activeId?" active":"");
    el.dataset.id = tl.id;
    el.innerHTML = `<div class="tl-dot"></div>
      <div class="tl-info">
        <div class="tl-name">${esc(tl.title)}</div>
        <div class="tl-meta">${tl.entries.length} 条 · ${last}</div>
      </div>
      <button class="tl-del" data-id="${tl.id}">×</button>`;
    list.appendChild(el);
  });
}

// ── Render main ──
function renderMain() {
  const tl = activeTL();
  const header = document.getElementById("header");
  const noSel = document.getElementById("no-sel");
  const emptyState = document.getElementById("empty-state");
  const addBtn = document.getElementById("add-btn-wrap");
  const content = document.getElementById("tl-content");

  // update mobile title
  document.getElementById("mobile-title").textContent = tl ? tl.title : "时间线笔记";

  if (!tl) {
    header.style.display="none"; noSel.style.display="block";
    emptyState.style.display="none"; addBtn.style.display="none";
    content.innerHTML=""; document.getElementById("draft-wrap").style.display="none";
    return;
  }
  if (!isMobile()) header.style.display="flex";
  noSel.style.display="none";
  document.getElementById("title-input").value = tl.title;
  document.getElementById("entry-count").textContent = `${tl.entries.length} 条记录`;
  emptyState.style.display = (!tl.entries.length&&!draftTime)?"block":"none";
  if (!draftTime) addBtn.style.display="block";

  content.innerHTML="";
  const groups={},order=[];
  tl.entries.forEach(e=>{const d=fmtDate(e.time);if(!groups[d]){groups[d]=[];order.push(d);}groups[d].push(e);});
  order.forEach(date=>{
    const sep=document.createElement("div"); sep.className="date-sep";
    sep.innerHTML=`<span>${date}</span><hr>`; content.appendChild(sep);
    const track=document.createElement("div"); track.className="day-track";
    groups[date].forEach(e=>track.appendChild(buildEntry(e)));
    content.appendChild(track);
  });
}

function buildEntry(entry) {
  const div=document.createElement("div");
  div.className="entry"; div.dataset.id=entry.id;
  if (editingId===entry.id) {
    div.innerHTML=`<div class="entry-dot"></div>
      <div class="entry-main">
        <div class="entry-time">${fmtTime(entry.time)}</div>
        <textarea class="edit-area" id="edit-${entry.id}">${esc(entry.text)}</textarea>
        <div class="edit-btns">
          <button class="icon-btn save-btn" data-id="${entry.id}">保存</button>
          <button class="icon-btn cancel-edit-btn">取消</button>
        </div>
      </div>`;
    setTimeout(()=>{const ta=document.getElementById(`edit-${entry.id}`);if(ta){ta.focus();ta.selectionStart=ta.value.length;}},30);
  } else {
    div.innerHTML=`<div class="entry-dot"></div>
      <div class="entry-main">
        <div class="entry-time">${fmtTime(entry.time)}</div>
        <div class="entry-text">${esc(entry.text)}</div>
      </div>
      <div class="entry-actions">
        <button class="icon-btn edit-btn" data-id="${entry.id}">编辑</button>
        <button class="icon-btn danger del-entry-btn" data-id="${entry.id}">删除</button>
      </div>`;
  }
  return div;
}

function render() { renderSidebar(); renderMain(); }

// ── Draft ──
function openDraft() {
  if (!activeId||draftTime) return;
  draftTime=new Date().toISOString();
  document.getElementById("draft-wrap").style.display="block";
  document.getElementById("draft-time").textContent=fmtFull(draftTime);
  document.getElementById("draft-textarea").value="";
  document.getElementById("add-btn-wrap").style.display="none";
  document.getElementById("empty-state").style.display="none";
  setTimeout(()=>{document.getElementById("draft-textarea").focus();document.getElementById("scroll-area").scrollTop=99999;},50);
}
function closeDraft() {
  draftTime=null;
  document.getElementById("draft-wrap").style.display="none";
  document.getElementById("add-btn-wrap").style.display="block";
  render();
}
function commitDraft() {
  const text=document.getElementById("draft-textarea").value.trim();
  if (!text){closeDraft();return;}
  const tl=activeTL();if(!tl)return;
  tl.entries.push({id:uid(),time:draftTime,text});
  saveDB();closeDraft();
  setTimeout(()=>{const sa=document.getElementById("scroll-area");sa.scrollTop=sa.scrollHeight;},100);
}

// ── Modals ──
function openNewTLModal(){document.getElementById("modal-tl-input").value="";document.getElementById("modal-new-tl").classList.add("show");setTimeout(()=>document.getElementById("modal-tl-input").focus(),80);}
function closeNewTLModal(){document.getElementById("modal-new-tl").classList.remove("show");}
function createTL(){
  const name=document.getElementById("modal-tl-input").value.trim()||"未命名时间线";
  const tl={id:uid(),title:name,entries:[]};
  db.timelines.push(tl);activeId=tl.id;
  saveDB();closeNewTLModal();render();
  if(isMobile())closeSidebar();
}
function openSyncModal(){document.getElementById("sync-token-input").value=getToken();document.getElementById("modal-sync").classList.add("show");setTimeout(()=>document.getElementById("sync-token-input").focus(),80);}
function closeSyncModal(){document.getElementById("modal-sync").classList.remove("show");}

// ── Events ──
document.getElementById("menu-btn").addEventListener("click",openSidebar);
document.getElementById("sidebar-overlay").addEventListener("click",closeSidebar);

document.getElementById("new-tl-btn").addEventListener("click",openNewTLModal);
document.getElementById("modal-tl-cancel").addEventListener("click",closeNewTLModal);
document.getElementById("modal-tl-ok").addEventListener("click",createTL);
document.getElementById("modal-tl-input").addEventListener("keydown",e=>{if(e.key==="Enter")createTL();if(e.key==="Escape")closeNewTLModal();});
document.getElementById("modal-new-tl").addEventListener("click",e=>{if(e.target===document.getElementById("modal-new-tl"))closeNewTLModal();});

document.getElementById("sync-setup-btn").addEventListener("click",openSyncModal);
document.getElementById("mobile-sync-dot").addEventListener("click",openSyncModal);
document.getElementById("modal-sync-cancel").addEventListener("click",closeSyncModal);
document.getElementById("modal-sync").addEventListener("click",e=>{if(e.target===document.getElementById("modal-sync"))closeSyncModal();});
document.getElementById("modal-sync-clear").addEventListener("click",()=>{if(confirm("清除本机保存的 Token？")){clearToken();setSyncStatus("","未配置同步");closeSyncModal();}});
document.getElementById("modal-sync-ok").addEventListener("click",async()=>{
  const t=document.getElementById("sync-token-input").value.trim();if(!t)return;
  setToken(t);closeSyncModal();await pullFromGist();
});

document.getElementById("tl-list").addEventListener("click",e=>{
  const del=e.target.closest(".tl-del");
  const item=e.target.closest(".tl-item");
  if(del){
    e.stopPropagation();
    const id=del.dataset.id;
    const tl=db.timelines.find(t=>t.id===id);
    if(confirm(`确认删除「${tl?.title||"该时间线"}」及其所有记录？`)){
      db.timelines=db.timelines.filter(t=>t.id!==id);
      if(activeId===id)activeId=db.timelines[0]?.id||null;
      draftTime=null;editingId=null;saveDB();render();
    }
    return;
  }
  if(item&&item.dataset.id!==activeId){
    activeId=item.dataset.id;draftTime=null;editingId=null;
    render();document.getElementById("scroll-area").scrollTop=0;
    if(isMobile())closeSidebar();
  }
});

document.getElementById("add-btn").addEventListener("click",openDraft);
document.getElementById("commit-btn").addEventListener("click",commitDraft);
document.getElementById("cancel-btn").addEventListener("click",closeDraft);
document.getElementById("draft-textarea").addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();commitDraft();}
  if(e.key==="Escape")closeDraft();
});

document.getElementById("title-input").addEventListener("input",e=>{
  const tl=activeTL();if(!tl)return;
  tl.title=e.target.value;saveDB();renderSidebar();
  document.getElementById("mobile-title").textContent=tl.title;
});

document.getElementById("tl-content").addEventListener("click",e=>{
  const eb=e.target.closest(".edit-btn");
  const db2=e.target.closest(".del-entry-btn");
  const sb=e.target.closest(".save-btn");
  const cb=e.target.closest(".cancel-edit-btn");
  if(eb){editingId=eb.dataset.id;render();}
  if(cb){editingId=null;render();}
  if(sb){
    const id=sb.dataset.id;
    const ta=document.getElementById(`edit-${id}`);
    const tl=activeTL();
    if(ta&&ta.value.trim()&&tl){tl.entries=tl.entries.map(e=>e.id===id?{...e,text:ta.value.trim()}:e);saveDB();}
    editingId=null;render();
  }
  if(db2){
    const id=db2.dataset.id;
    if(confirm("确认删除这条记录？")){
      const tl=activeTL();
      if(tl){tl.entries=tl.entries.filter(e=>e.id!==id);saveDB();render();}
    }
  }
});
document.getElementById("tl-content").addEventListener("keydown",e=>{
  if(e.key==="Escape"&&editingId){editingId=null;render();}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const b=document.querySelector(".save-btn");if(b)b.click();}
});

document.getElementById("export-btn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  const now=new Date();const p=n=>String(n).padStart(2,"0");
  a.href=url;a.download=`timeline-notes-${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}.json`;
  a.click();URL.revokeObjectURL(url);
});
document.getElementById("import-btn").addEventListener("click",()=>{document.getElementById("import-file").value="";document.getElementById("import-file").click();});
document.getElementById("import-file").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.timelines||!Array.isArray(imported.timelines)){alert("文件格式不对。");return;}
      const merge=db.timelines.length===0?true:confirm("「确定」= 合并追加\n「取消」= 覆盖替换");
      if(!merge){db=imported;}else{
        const ids=new Set(db.timelines.map(t=>t.id));
        imported.timelines.forEach(tl=>{if(ids.has(tl.id)){tl.id=uid();tl.title+=" (导入)";}db.timelines.push(tl);});
      }
      saveDB();activeId=db.timelines[0]?.id||null;draftTime=null;editingId=null;render();
      alert(`导入成功！共 ${imported.timelines.length} 条时间线。`);
    }catch{alert("文件读取失败。");}
  };
  reader.readAsText(file);
});

// ── Init ──
loadDB();
if(db.timelines.length) activeId=db.timelines[0].id;
render();
if(getToken()){setSyncStatus("syncing","同步中…");pullFromGist();}
else setSyncStatus("","未配置同步");
</script>
</body>
</html>
